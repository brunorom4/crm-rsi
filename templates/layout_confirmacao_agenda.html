<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Agenda — Claro</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Mesma linguagem visual do Painel de Resultados e do Painel de
           Cotas -- Guia de Marca Claro, Janeiro/2025 (paleta pág.12) --
           pedido do Bruno, 2026-09-16, pra padronizar os 3 módulos. */
        :root {
            --claro-vermelho: #DA291C;
            --claro-vermelho-forte: #ED1C24;
            --claro-vermelho-escuro: #AF272F;
            --claro-laranja: #F5842B;
            --claro-preto: #2D2926;
            --claro-cinza: #A7A8AA;
            --claro-cinza-claro: #f4f5f7;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
            background: var(--claro-cinza-claro);
            margin: 0;
            color: var(--claro-preto);
        }
        h1, h2, h3, h4, h5, h6, .kpi { font-family: 'Poppins', sans-serif; font-weight: 700; }

        /* ---- cabeçalho com a marca Claro (idêntico ao Painel de Cotas /
           Painel de Resultados) ---- */
        .topo-claro {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, var(--claro-vermelho-forte) 0%, var(--claro-vermelho) 55%, var(--claro-vermelho-escuro) 100%);
            padding: 18px 28px;
            display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
            box-shadow: 0 2px 10px rgba(175,39,47,0.25);
        }
        .sol-deco { position: absolute; right: -30px; bottom: -30px; width: 150px; height: 150px; opacity: .14; pointer-events: none; }
        .topo-claro .marca-esquerda { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
        .topo-claro img.logo { height: 42px; width: 42px; object-fit: contain; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.25)); }
        .topo-claro .titulos h1 { color: #fff; font-size: 20px; font-weight: 800; margin: 0; letter-spacing: 0.2px; }
        .topo-claro .titulos .subtitulo { color: rgba(255,255,255,0.88); font-size: 12.5px; margin-top: 2px; }
        .topo-claro .acoes { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; position: relative; z-index: 1; }
        .topo-claro .acoes a { color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
        .topo-claro .acoes a:hover { text-decoration: underline; }

        .conteudo-conf { padding: 24px 28px 40px; max-width: 1100px; margin: 0 auto; }
        .card-shadow { background: #fff; border: none; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
        .btn-danger {
            background: linear-gradient(135deg, var(--claro-vermelho-forte), var(--claro-vermelho-escuro));
            border: none; font-weight: 700;
            transition: filter 0.15s, transform 0.1s;
        }
        .btn-danger:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .btn-portal {
            display: flex; flex-direction: column; gap: 2px;
            padding: 16px 20px; border-radius: 12px; text-decoration: none;
            background: #fff; border: 1px solid #e7e5e4; color: var(--claro-preto);
            transition: box-shadow .15s;
        }
        .btn-portal:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        .btn-portal span { font-weight: 700; font-size: 1rem; }
        .btn-portal small { color: var(--claro-cinza); }

        .rodape-marca {
            max-width: 1100px; margin: 30px auto 0; padding: 0 28px 10px;
            display: flex; align-items: center; justify-content: flex-end; gap: 8px;
            color: #b3aeaa; font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="topo-claro">
        <svg class="sol-deco" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="35" cy="65" r="14" stroke="#fff" stroke-width="7"/>
            <rect x="30" y="8" width="9" height="26" fill="#fff"/>
            <rect x="55" y="70" width="26" height="9" fill="#fff"/>
            <rect x="52" y="18" width="9" height="34" fill="#fff" transform="rotate(45 56 35)"/>
        </svg>
        <div class="marca-esquerda">
            <img class="logo" src="/static/logo-claro.png" alt="Claro" onerror="this.style.display='none'">
            <div class="titulos">
                <h1>Confirmação de Agenda</h1>
                <div class="subtitulo">{{ usuario_conf['nome'] if usuario_conf else '' }}</div>
            </div>
        </div>
        <div class="acoes">
            {% if usuario_conf and usuario_conf['perfil'] == 'ADM' %}
            <a href="/confirmacao-agenda/extracao"><i class="bi bi-file-earmark-excel"></i> Extração</a>
            <a href="/confirmacao-agenda/cidades-bloqueadas"><i class="bi bi-slash-circle"></i> Cidades Bloqueadas</a>
            {% endif %}
            <a href="/confirmacao-agenda"><i class="bi bi-grid-fill"></i> Painel</a>
            <a href="/confirmacao-agenda/buscar"><i class="bi bi-search"></i> Buscar Contrato</a>
            <a href="/portal"><i class="bi bi-box-arrow-left"></i> Voltar ao Portal</a>
            <a href="/trocar-senha"><i class="bi bi-lock-fill"></i> Trocar senha</a>
            <a href="/logout"><i class="bi bi-box-arrow-right"></i> Sair</a>
        </div>
    </div>
    <div class="conteudo-conf">
        {% block conteudo %}{% endblock %}
    </div>
    <div class="rodape-marca">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="7" cy="17" r="3.2" stroke="#c9c4c0" stroke-width="2"/>
            <rect x="10.2" y="4" width="2.4" height="6.5" rx="1" fill="#c9c4c0"/>
            <rect x="15.5" y="6.2" width="2.4" height="7.5" rx="1" fill="#c9c4c0" transform="rotate(45 16.7 10)"/>
            <rect x="14" y="16" width="6" height="2.2" rx="1" fill="#c9c4c0"/>
        </svg>
        Claro · Confirmação de Agenda
    </div>
</body>
</html>
