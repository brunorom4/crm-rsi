<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Migração RSI — Login</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .cena {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: url('/static/img/login-fundo.png') center center / cover no-repeat;
        }

        /* leve sombra escura por cima da imagem, só pra garantir contraste do texto */
        .cena::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(10,5,10,.35) 0%, rgba(10,5,10,0) 22%, rgba(10,5,10,0) 70%, rgba(10,5,10,.45) 100%);
            z-index: 1;
        }

        .logo-topo {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            width: 88px; height: 88px;
            border-radius: 50%;
            background: white;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        .logo-topo img { max-width: 62%; max-height: 62%; object-fit: contain; }

        .titulo-topo {
            position: absolute;
            top: calc(6% + 100px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            text-align: center;
            width: 100%;
        }
        .titulo-topo h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 1.7rem;
            color: #fff6ec;
            text-shadow: 0 2px 14px rgba(0,0,0,0.5);
            margin: 0;
            letter-spacing: 0.03em;
        }
        .titulo-topo span {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: #fff6ec;
            text-transform: uppercase;
            margin-top: 8px;
            background: rgba(162, 0, 29, 0.85);
            padding: 4px 14px;
            border-radius: 999px;
        }

        .painel-login {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 340px;
            background: rgba(253, 248, 240, 0.94);
            border-radius: 22px;
            padding: 30px 28px 26px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            text-align: center;
        }

        .campo { margin-bottom: 14px; text-align: left; }
        .campo-input {
            display: flex; align-items: center; gap: 10px;
            background: white;
            border: 1px solid rgba(162, 0, 29, 0.15);
            border-radius: 999px;
            padding: 12px 18px;
        }
        .campo-input i { color: #a2001d; font-size: 0.95rem; opacity: 0.7; }
        .campo-input input {
            border: none; outline: none; background: transparent;
            font-size: 0.9rem; color: #2a1010; width: 100%;
        }
        .campo-input input::placeholder { color: #b3a89f; }

        .btn-entrar {
            width: 100%;
            padding: 13px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ff8a3d, #a2001d);
            color: white;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.03em;
            cursor: pointer;
            margin-top: 4px;
            transition: filter 0.15s;
        }
        .btn-entrar:hover { filter: brightness(1.08); }

        .erro {
            background: rgba(220,53,69,0.9);
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            margin-bottom: 14px;
            text-align: left;
        }

        .rodape {
            position: absolute;
            bottom: 14px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 5;
            color: rgba(255,240,225,0.85);
            font-size: 0.72rem;
            letter-spacing: 0.02em;
            text-shadow: 0 1px 8px rgba(0,0,0,0.6);
        }

        @media (max-height: 720px) {
            .logo-topo { width: 70px; height: 70px; top: 3%; }
            .titulo-topo { top: calc(3% + 80px); }
            .titulo-topo h1 { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
    <div class="cena">
        <div class="logo-topo">
            <img src="/static/logo-claro.png" alt="Claro" onerror="this.style.display='none'">
        </div>

        <div class="titulo-topo">
            <h1>CRM RSI</h1>
            <span>Migração Fibra</span>
        </div>

        <div class="painel-login">
            {% if erro %}
            <div class="erro">{{ erro }}</div>
            {% endif %}
            <form method="POST">
                <div class="campo">
                    <div class="campo-input">
                        <i class="bi bi-person-fill"></i>
                        <input type="text" name="login" placeholder="Usuário" required autofocus>
                    </div>
                </div>
                <div class="campo">
                    <div class="campo-input">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" name="senha" placeholder="Senha" required>
                    </div>
                </div>
                <button type="submit" class="btn-entrar">Acessar</button>
            </form>
        </div>

        <div class="rodape">
            Desenvolvido por Bruno Roma — Gestão da Qualidade RSI — Todos os direitos reservados. Ver {{ versao_sistema }}
        </div>
    </div>
</body>
</html>
