{% extends "layout.html" %}

{% block conteudo %}
<div class="card card-shadow">
    <div class="card-body">
        <h2><i class="bi bi-clock-fill"></i> Extração de Login, Logout e Pausas</h2>
        <p class="text-muted">
            Gera uma planilha Excel com o histórico de início/fim de tratamento (login/logout)
            e de pausas de todo mundo, dentro do período escolhido — uma aba pra cada.
        </p>
        <hr>
        <form action="/extracao/pontualidade/gerar" method="GET" class="d-flex gap-2 align-items-end flex-wrap">
            <div>
                <label class="form-label">Data início</label>
                <input type="date" name="data_inicio" class="form-control" value="{{ hoje }}" required>
            </div>
            <div>
                <label class="form-label">Data fim</label>
                <input type="date" name="data_fim" class="form-control" value="{{ hoje }}" required>
            </div>
            <button type="submit" class="btn btn-danger"><i class="bi bi-file-earmark-excel"></i> Gerar Excel</button>
        </form>
    </div>
</div>
{% endblock %}
